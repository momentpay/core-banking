# The Apache Fineract parity oracle, in Docker. Local parity testing only. NOT YET RUN: see
# parity/docker/Dockerfile. On a machine without working Docker use scripts/start-oracle.sh.
#
#   docker compose -f parity/docker-compose.yml up -d --build
#   parity/scripts/smoke.sh
#
# Fineract answers on https://localhost:8443/fineract-provider (self-signed certificate).
# The database is published on 127.0.0.1:54330 so it does not clash with a local PostgreSQL.
name: ecb-parity

services:
  fineract-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fineract-local-only
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - fineract-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  fineract:
    build:
      context: ./docker
      args:
        FINERACT_VERSION: "1.16.1"
    env_file: ./docker/fineract.env
    ports:
      - "8443:8443"
    depends_on:
      fineract-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8443' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    tmpfs:
      - /tmp:size=256m

volumes:
  fineract-pgdata:
